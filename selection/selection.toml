# Bahuan era selection. Resolution: override → subgroup → fallback → avoid.
# Draft from the per-subgroup shortlists (selection/shortlist/*.json); open
# calls are listed in selection/shortlist/REVIEW.md.
#
# A list value is tried in order before the fallback. ["android-7.1",
# "android-12"] pins android-12 even where its art is unchanged since
# android-11: for people and animals that 2020 art is borderless, and latest
# is the worse match (contour lines, heavier shading, keycap tiles).

[defaults]
fallback = ["android-12", "android-16", "latest"]   # post-blob emoji: newest flat Google design
avoid = ["android-8.0", "android-11"] # bordered clip-art; only if nothing else exists

[subgroup]
# Smileys & Emotion
face-smiling = "android-7.1"            # classic blob
face-affection = "android-7.1"
face-tongue = "android-7.1"
face-hand = "android-7.1"               # 5 of 7 end up latest round faces
face-neutral-skeptical = "android-7.1"
face-sleepy = "android-7.1"
face-unwell = "android-7.1"
face-hat = "android-7.1"
face-glasses = "android-7.1"
face-concerned = "android-7.1"
face-negative = "android-7.1"           # 7.1 skulls are the only unbordered ones
face-costume = "android-7.1"
cat-face = "android-7.1"
monkey-face = "android-7.1"
heart = "android-7.1"                   # orange/brown/white hearts are =11 → redraw
emotion = "android-7.1"

# People & Body
hand-fingers-open = "android-7.1"       # hands match 7.1 person-gesture; =11 hands skip to latest 2D
hand-fingers-partial = "android-7.1"
hand-single-finger = "android-7.1"
hand-fingers-closed = "android-7.1"
hands = "android-7.1"
hand-prop = "android-7.1"
body-parts = "android-7.1"
person = ["android-7.1", "android-12"]           # 1f9d1/child/hair ZWJ from 2020 art
person-gesture = ["android-7.1", "android-12"]   # deaf person from 2020 art
person-role = ["android-12", "android-16"]       # one design per profession trio (see REVIEW); pregnant trio from 16
person-fantasy = "android-12"                    # keeps Santa/Mrs/Mx Claus coherent
person-activity = ["android-7.1", "android-16"]
person-sport = ["android-7.1", "android-12"]     # latest sports are grey, heavier
person-resting = ["android-7.1", "android-12"]   # latest lotus adds contour lines
family = ["android-7.1", "android-12"]           # never latest: keycap tiles
person-symbol = "android-12"                     # light-blue busts match hugging/fingerprint

# Animals & Nature
animal-mammal = ["android-7.1", "android-12"]    # fallbacks: 2020 borderless animals
animal-bird = ["android-7.1", "android-12"]
animal-amphibian = "android-7.1"
animal-reptile = ["android-7.1", "android-12"]
animal-marine = ["android-7.1", "android-12"]
animal-bug = ["android-7.1", "android-12"]
plant-flower = "android-12"             # plants were truly redrawn in 2021
plant-other = "android-16" # leaf fluttering redraw reads at 20px; a16 flatter than latest

# Food & Drink
