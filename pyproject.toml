[project]
name = "bahuan"
version = "0.1.0"
description = "Blob-era emoji font built from Google's Noto Emoji art"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fonttools[woff]>=4.59",
    "nanoemoji>=0.16",
    "notofonttools>=0.4",
    "picosvg>=0.23",
    "pillow>=11",
    "resvg-cli>=0.44",
    "tomlkit>=0.13",
]

[dependency-groups]
dev = [
    "fontbakery>=1.0",
    "playwright>=1.50",
    "pytest>=8.4",
]

[project.scripts]
steamer = "steamer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steamer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
