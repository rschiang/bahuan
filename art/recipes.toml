# Derived art: `steamer redraw` writes art/derived/ from these recipes.
# from = "era:key" donor master; ops run as drop → recolor → fill.
# subpath = N keeps only subpath N of each <path> (an Illustrator frame holds its cut-out as one).
# [[<key>.add]] draws another master on top, with the same ops plus `scale` about the canvas centre.
# art/fixes/ wins over a recipe.

